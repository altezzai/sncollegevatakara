{% extends "admin_header.html" %}
{% block content %}
  {% load static %}
  <body class="edit-body">
    <div class="edit-formcon">
      <h2>Create IQAC Member</h2>

      {% if error %}
        <div style="color: red; margin-bottom: 10px;">{{ error }}</div>
      {% endif %}

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <label for="name">Name:</label>
        <input class="inp" type="text" id="name" name="name" required />

        <label for="department">Department:</label>
        <input class="inp" type="text" id="department" name="department" placeholder="e.g. Dept of Zoology" required />

        <label for="role">Position:</label>
        <select class="inp" id="role" name="role">
          <option value="coordinator">Coordinator</option>
          <option value="joint_coordinator">Joint Coordinator</option>
          <option value="member" selected>Member</option>
        </select>

        <label for="photo">Photo (optional):</label>
        <input class="inp" type="file" id="photo" name="photo" accept="image/*" />

        <button type="submit" class="btn">Create</button>
      </form>

      <a href="{% url 'iqac_member_list' %}" class="btn-edit btn">Back to List</a>
    </div>
  {% endblock %}
  </body>
