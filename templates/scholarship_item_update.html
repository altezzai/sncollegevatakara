{% extends 'admin_header.html' %}
{% block content %}
  {% load static %}
  <div class="admin-container">
    <div class="admin-title">
      <h2>Update Scholarship</h2>
    </div>

      {% if error %}
        <div style="color: red; margin-bottom: 10px;">{{ error }}</div>
      {% endif %}

      <form method="post" enctype="multipart/form-data" class="admin-form">
        {% csrf_token %}

        <label>Scholarship Name</label>
        <input type="text" name="name" value="{{ item.name }}" required />

        {% if item.image %}
          <div>
            <label style="display: block; margin-bottom: 6px;">Current Image</label>
            <img src="{{ item.image.url }}" alt="" style="max-width: 220px; border-radius: 10px; display: block;" />
          </div>
        {% endif %}

        <label>Change Image (optional)</label>
        <input type="file" name="image" accept="image/*" />

        <label>Description (optional)</label>
        <textarea name="description" rows="4">{{ item.description }}</textarea>

        <label>Link (optional)</label>
        <input type="url" name="link_url" value="{{ item.link_url }}" placeholder="https://..." />

        <label class="admin-toggle"><input type="checkbox" name="is_active" {% if item.is_active %}checked{% endif %} />Active</label>

        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
          <button type="submit" class="btn-edit btn">Update</button>
          <a href="{% url 'scholarship_item_list' %}" class="btn-edit btn">Back to List</a>
        </div>
      </form>
  </div>
{% endblock %}
