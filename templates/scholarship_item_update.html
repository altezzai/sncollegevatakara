{% extends "admin_header.html" %}
{% block content %}
  {% load static %}
  <div class="edit-formcon">
      <h2>Update Scholarship</h2>

      {% if error %}
        <div style="color: red; margin-bottom: 10px;">{{ error }}</div>
      {% endif %}

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <label for="name">Scholarship name:</label>
        <input class="inp" type="text" id="name" name="name" value="{{ item.name }}" required />

        {% if item.image %}
          <label>Current Image:</label>
          <img src="{{ item.image.url }}" alt="" style="max-width: 180px; border-radius: 10px;" />
        {% endif %}

        <label for="image">Change image (optional):</label>
        <input class="inp" type="file" id="image" name="image" accept="image/*" />

        <label for="description">Description (optional):</label>
        <textarea class="inp" id="description" name="description" rows="4">{{ item.description }}</textarea>

        <label for="link_url">Link (optional):</label>
        <input class="inp" type="url" id="link_url" name="link_url" value="{{ item.link_url }}" placeholder="https://..." />

        <label for="is_active">Active:</label>
        <input class="inp" style="height: 20px; width: 20px;" type="checkbox" id="is_active" name="is_active" {% if item.is_active %}checked{% endif %} />

        <button type="submit" class="btn">Update</button>
      </form>

      <a href="{% url 'scholarship_item_list' %}" class="btn-edit btn">Back to List</a>
  </div>
{% endblock %}
