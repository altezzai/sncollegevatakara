{% extends "admin_header.html" %} 
{% block content %} 
{% load static %}

<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<style>
  .crop-container {
    display: none;
    max-width: 100%;
    margin-bottom: 20px;
  }
  .crop-container img {
    max-width: 100%;
    display: block;
  }
</style>

<body class="edit-body">
  <div class="edit-formcon">
    <h2>Update Banner</h2>
    <form id="employeeForm" method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <label for="image">Image:</label>
      
      <img
        id="currentImagePreview"
        class="imgpreview"
        src="{{ banner.image.url }}"
        alt="{{ banner.url }} image"
        width="100"
      />

      <input
        class="inp"
        type="file"
        id="image"
        name="image"
        accept="image/*"
      />

      <div class="crop-container" id="cropContainer">
        <img id="imageToCrop" src="" alt="Picture">
      </div>

      <label for="url">URL:</label>
      <input
        class="inp"
        type="url"
        id="url"
        name="url"
        value="{{ banner.url }}"
      />
      <button type="submit" value="Submit">Submit</button>
    </form>
    <a href="{% url 'employee_list' %}" class="btn-edit btn">Back to List</a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const imageInput = document.getElementById('image');
      const cropContainer = document.getElementById('cropContainer');
      const imageToCrop = document.getElementById('imageToCrop');
      const currentImagePreview = document.getElementById('currentImagePreview');
      const form = document.getElementById('employeeForm');
      let cropper;
      let originalFileName = 'updated_banner.jpg';

      imageInput.addEventListener('change', function(e) {
        const files = e.target.files;
        if (files && files.length > 0) {
          const file = files[0];
          originalFileName = file.name;
          const reader = new FileReader();

          reader.onload = function(event) {
            // Hide the original preview since we are adding a new one
            if(currentImagePreview) currentImagePreview.style.display = 'none';
            
            imageToCrop.src = event.target.result;
            cropContainer.style.display = 'block';

            if (cropper) {
              cropper.destroy();
            }

            cropper = new Cropper(imageToCrop, {
              aspectRatio: 16 / 9, // Adjust ratio as needed
              viewMode: 2,
              autoCropArea: 1,
            });
          };
          reader.readAsDataURL(file);
        }
      });

      form.addEventListener('submit', function(e) {
        // If the user didn't select a new image, cropper is null. Let it submit normally.
        if (!cropper) return; 
        
        e.preventDefault(); 

        cropper.getCroppedCanvas({
          width: 1200, 
          height: 675, 
        }).toBlob((blob) => {
          
          const croppedFile = new File([blob], originalFileName, { type: "image/jpeg", lastModified: new Date().getTime() });
          const dataTransfer = new DataTransfer();
          dataTransfer.items.add(croppedFile);
          imageInput.files = dataTransfer.files;

          cropper.destroy();
          cropper = null;
          form.submit(); 

        }, 'image/jpeg', 0.8);
      });
    });
  </script>
</body>
{% endblock %}
