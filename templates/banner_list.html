{% extends "admin_header.html" %} {% block content %} {% load static %}
<div class="admin-container">
  <div class="admin-title">
    <h2>Banner List</h2>
    <a class="btn-add btn" href="{% url 'create_banner' %}"
      ><img src="{% static 'assets/new.svg' %}" class="img-small" alt="" />New
    </a>
  </div>
  <div class="table-con">
    <table>
      <thead>
        <tr>
          <th>Photo</th>
          <th>URL</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for banner in banners %}
        <tr>
          <td>
            <img
              src="{{ banner.image.url }}"
              alt="{{ banner.url }} Photo"
              class="photo-list"
            />
          </td>
          <td>{{ banner.url }}</td>
          <td>
            <a class="btn-edit btn" href="{% url 'update_banner' banner.id %}"
              >Edit</a
            >
            <a class="btn-delete btn" href="{% url 'delete_banner' banner.id %}"
              >Delete</a
            >
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="5">No banners available.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% endblock %}
  </div>
</div>
