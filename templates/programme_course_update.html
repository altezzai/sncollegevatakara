{% extends 'admin_header.html' %}
{% block content %}
  <div class="admin-container">
    <div class="admin-title">
      <h2>Update Course</h2>
    </div>

    {% if error %}
      <div style="color: red; margin-bottom: 10px;">{{ error }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="admin-form">
      {% csrf_token %}

      <label>Course Name</label>
      <input type="text" name="title" value="{{ course.title }}" required />

      <label>Type</label>
      <select name="course_type" required>
        <option value="fyugp" {% if course.course_type == 'fyugp' %}selected{% endif %}>UG - FYUGP</option>
        <option value="ug" {% if course.course_type == 'ug' %}selected{% endif %}>UG</option>
        <option value="pg" {% if course.course_type == 'pg' %}selected{% endif %}>PG</option>
      </select>

      <label>Replace Syllabus (PDF - optional)</label>
      <input type="file" name="syllabus_pdf" accept="application/pdf" />

      {% if course.syllabus_pdf %}
        <p style="margin-top: 4px;">Current: <a href="{{ course.syllabus_pdf.url }}" target="_blank">View PDF</a></p>
      {% endif %}

      <label class="admin-toggle"><input type="checkbox" name="is_active" {% if course.is_active %}checked{% endif %} />Active</label>

      <button type="submit" class="btn-edit btn">Update</button>
    </form>
  </div>
{% endblock %}
