{% extends 'header.html' %}
{% block content %}
  <div class="container banner">
    <div class="heading">Campus Life</div>
  </div>

  <div class="container">
    <div class="sec-container column-flex">
      {% if pages %}
        <div class="small-container">
          <ul>
            {% for p in pages %}
              <li style="margin-bottom: 10px;">
                <a href="{% url 'campus_life_page' slug=p.slug %}"><strong>{{ p.title }}</strong></a>
              </li>
            {% endfor %}
          </ul>
        </div>
      {% else %}
        <div class="small-container">
          <p>No Campus Life pages published yet.</p>
        </div>
      {% endif %}
    </div>
  </div>
{% endblock %}
