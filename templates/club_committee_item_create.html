{% extends 'admin_header.html' %}
{% block content %}
  <div class="admin-container">
    <div class="admin-title">
      <h2>Add Club / Committee</h2>
    </div>

    {% if error %}
      <div style="color: red; margin-bottom: 10px;">{{ error }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="admin-form">
      {% csrf_token %}

      <label>Club / Committee Name</label>
      <input type="text" name="name" required />

      <label>Description</label>
      <textarea name="description" rows="5" required></textarea>

      <label class="admin-toggle"><input type="checkbox" name="is_active" checked />Active</label>

      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
        <button type="submit" class="btn-add btn">Create</button>
        <a href="{% url 'club_committee_item_list' %}" class="btn-edit btn">Back to List</a>
        <a href="{% url 'club_committee_person_list' %}" class="btn-edit btn">Manage People</a>
      </div>
    </form>
  </div>
{% endblock %}
