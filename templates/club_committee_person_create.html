{% extends 'admin_header.html' %}
{% block content %}
  <div class="admin-container">
    <div class="admin-title">
      <h2>Add Club / Committee Person</h2>
    </div>

    {% if error %}
      <div style="color: red; margin-bottom: 10px;">{{ error }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="admin-form">
      {% csrf_token %}

      <label>Club / Committee</label>
      <select name="club_id" required>
        <option value="">Select Club / Committee</option>
        {% for club in clubs %}
          <option value="{{ club.id }}">{{ club.name }}</option>
        {% endfor %}
      </select>

      {% if not clubs %}
        <div style="color: #666; margin: 10px 0 0;">Create a club/committee before adding people.</div>
      {% endif %}

      <label>Person Name</label>
      <input type="text" name="person_name" required />

      <label>Person Position</label>
      <input type="text" name="person_position" required />

      <label>Person Image (optional)</label>
      <input type="file" name="person_photo" accept="image/*" />

      <label class="admin-toggle"><input type="checkbox" name="is_active" checked />Active</label>

      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
        <button type="submit" class="btn-add btn">Create</button>
        <a href="{% url 'club_committee_person_list' %}" class="btn-edit btn">Back to List</a>
      </div>
    </form>
  </div>
{% endblock %}
