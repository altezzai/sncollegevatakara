{% extends 'admin_header.html' %}
{% block content %}
  <div class="admin-container">
    <div class="admin-title">
      <h2>Create Course</h2>
    </div>

    {% if error %}
      <div style="color: red; margin-bottom: 10px;">{{ error }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="admin-form">
      {% csrf_token %}

      <label>Course Name</label>
      <input type="text" name="title" placeholder="Course name" required />

      <label>Type</label>
      <select name="course_type" required>
        <option value="fyugp">UG - FYUGP</option>
        <option value="ug" selected>UG</option>
        <option value="pg">PG</option>
      </select>

      <label>Syllabus (PDF)</label>
      <input type="file" name="syllabus_pdf" accept="application/pdf" required />

      <label class="admin-toggle"><input type="checkbox" name="is_active" checked />Active</label>

      <button type="submit" class="btn-add btn">Create</button>
    </form>
  </div>
{% endblock %}
