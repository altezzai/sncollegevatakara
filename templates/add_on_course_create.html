{% extends 'admin_header.html' %}
{% block content %}
  <div class="admin-container">
    <div class="admin-title">
      <h2>Create Add-on Course</h2>
    </div>

    {% if error %}
      <div style="color: red; margin-bottom: 10px;">{{ error }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="admin-form">
      {% csrf_token %}

      <label>Course Name</label>
      <input type="text" name="title" placeholder="Course name" required />

      <label>Description</label>
      <textarea name="description" rows="5" placeholder="Description (optional)"></textarea>

      <label>Syllabus (PDF - optional)</label>
      <input type="file" name="file" />

      <label style="display: flex; gap: 10px; align-items: center; margin-top: 10px;"><input type="checkbox" name="is_active" checked />Active</label>

      <button type="submit" class="btn-add btn">Create</button>
    </form>
  </div>
{% endblock %}
