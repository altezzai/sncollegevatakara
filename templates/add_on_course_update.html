{% extends 'admin_header.html' %}
{% block content %}
  <div class="admin-container">
    <div class="admin-title">
      <h2>Update Add-on Course</h2>
    </div>

    {% if error %}
      <div style="color: red; margin-bottom: 10px;">{{ error }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="admin-form">
      {% csrf_token %}

      <label>Course Name</label>
      <input type="text" name="title" value="{{ course.title }}" required />

      <label>Description</label>
      <textarea name="description" rows="5" placeholder="Description (optional)">{{ course.description }}</textarea>

      <label>Replace Syllabus (PDF - optional)</label>
      <input type="file" name="file" />

      {% if course.file %}
        <p style="margin-top: 8px;">
          Current: <a href="{{ course.file.url }}" target="_blank">View</a>
        </p>
      {% endif %}

      <label style="display: flex; gap: 10px; align-items: center; margin-top: 10px;">
        <input type="checkbox" name="is_active" {% if course.is_active %}checked{% endif %} />
        Active
      </label>

      <button type="submit" class="btn-edit btn">Update</button>
    </form>
  </div>
{% endblock %}
